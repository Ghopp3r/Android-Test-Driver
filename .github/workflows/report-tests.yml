name: APK report checks

on:
  push:
    branches:
      - codex/apk-report-fixes
    paths:
      - apk/**
      - .github/workflows/report-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify the report UI and build APKs
        run: gradle -p apk testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon --console=plain
      - name: Upload reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-report-checks-${{ github.sha }}
          path: |
            apk/app/build/test-results/testDebugUnitTest/*.xml
            apk/app/build/outputs/apk/debug/*.apk
            apk/app/build/outputs/apk/release/*.apk
            apk/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
